# Bitmovin Encoding Template — generated by bitovp from plan "dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: I-frame playlists attach to run-time variant ids and are
# not representable here — re-add them via the API.
metadata:
  type: VOD
  name: dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h265:
      v2160:
        properties:
          name: H265 DV 2160p
          height: 2160
          bitrate: 15000000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 0.5
      v1080:
        properties:
          name: H265 DV 1080p
          height: 1080
          bitrate: 6000000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 0.8
      v720:
        properties:
          name: H265 DV 720p
          height: 720
          bitrate: 3000000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 1
      v540:
        properties:
          name: H265 DV 540p
          height: 540
          bitrate: 1800000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 1.2
  audio:
    aac:
      aac128:
        properties:
          name: AAC 128000bps
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
    dolbyAtmos:
      atmos448:
        properties:
          bitrate: 448000
          rate: 48000
          loudnessControl:
            meteringMode: ITU-R BS.1770-4
            dialogueIntelligence: ENABLED
            speechThreshold: 15
encodings:
  main:
    properties:
      name: dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    inputStreams:
      dolbyAtmos:
        atmos-in:
          properties:
            inputId: $/inputs/s3/main
            inputPath: <INSERT_DOLBY_ATMOS_DAMF_PATH>
            inputFormat: DAMF
      dolbyVision:
        dv-in:
          properties:
            inputId: $/inputs/s3/main
            videoInputPath: <INSERT_DOLBY_VISION_VIDEO_PATH>
            metadataInputPath: <INSERT_DOLBY_VISION_METADATA_PATH>
    streams:
      v2160:
        properties:
          name: Stream H265 DV 2160p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v2160
          mode: STANDARD
      v1080:
        properties:
          name: Stream H265 DV 1080p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v1080
          mode: STANDARD
      v720:
        properties:
          name: Stream H265 DV 720p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v720
          mode: STANDARD
      v540:
        properties:
          name: Stream H265 DV 540p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v540
          mode: STANDARD
      atmos448:
        properties:
          name: Stream ATMOS 448000bps
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyAtmos/atmos-in
          codecConfigId: $/configurations/audio/dolbyAtmos/atmos448
          mode: STANDARD
      aac128:
        properties:
          name: Stream AAC 128000bps
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: <INSERT_AAC_2_0_MEZZANINE_PATH>
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/aac128
          mode: STANDARD
    muxings:
      fmp4:
        v2160:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v2160
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/video/dv/2160p_15000000/
                acl:
                  - permission: PUBLIC_READ
        v1080:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v1080
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/video/dv/1080p_6000000/
                acl:
                  - permission: PUBLIC_READ
        v720:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v720
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/video/dv/720p_3000000/
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/video/dv/540p_1800000/
                acl:
                  - permission: PUBLIC_READ
        atmos448:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/atmos448
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/audio/atmos/448000/
                acl:
                  - permission: PUBLIC_READ
        aac128:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/aac128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/audio/aac/128000/
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "8"
        hlsMediaPlaylistVersion: "8"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          atmos448:
            properties:
              name: English Atmos
              groupId: atmos
              language: en
              isDefault: false
              autoselect: true
              segmentPath: audio/atmos/448000/
              uri: audio_atmos_448000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/atmos448
              muxingId: $/encodings/main/muxings/fmp4/atmos448
          aac128:
            properties:
              name: English AAC
              groupId: aac
              language: en
              isDefault: true
              autoselect: true
              segmentPath: audio/aac/128000/
              uri: audio_aac_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/aac128
              muxingId: $/encodings/main/muxings/fmp4/aac128
      streams:
        v2160-aac:
          properties:
            audio: aac
            closedCaptions: NONE
            segmentPath: video/dv/2160p_15000000/
            uri: video_dv_2160p_15000000_aac.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v2160
            muxingId: $/encodings/main/muxings/fmp4/v2160
        v2160-atmos:
          properties:
            audio: atmos
            closedCaptions: NONE
            segmentPath: video/dv/2160p_15000000/
            uri: video_dv_2160p_15000000_atmos.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v2160
            muxingId: $/encodings/main/muxings/fmp4/v2160
        v1080-aac:
          properties:
            audio: aac
            closedCaptions: NONE
            segmentPath: video/dv/1080p_6000000/
            uri: video_dv_1080p_6000000_aac.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v1080
            muxingId: $/encodings/main/muxings/fmp4/v1080
        v1080-atmos:
          properties:
            audio: atmos
            closedCaptions: NONE
            segmentPath: video/dv/1080p_6000000/
            uri: video_dv_1080p_6000000_atmos.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v1080
            muxingId: $/encodings/main/muxings/fmp4/v1080
        v720-aac:
          properties:
            audio: aac
            closedCaptions: NONE
            segmentPath: video/dv/720p_3000000/
            uri: video_dv_720p_3000000_aac.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v720
            muxingId: $/encodings/main/muxings/fmp4/v720
        v720-atmos:
          properties:
            audio: atmos
            closedCaptions: NONE
            segmentPath: video/dv/720p_3000000/
            uri: video_dv_720p_3000000_atmos.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v720
            muxingId: $/encodings/main/muxings/fmp4/v720
        v540-aac:
          properties:
            audio: aac
            closedCaptions: NONE
            segmentPath: video/dv/540p_1800000/
            uri: video_dv_540p_1800000_aac.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
        v540-atmos:
          properties:
            audio: atmos
            closedCaptions: NONE
            segmentPath: video/dv/540p_1800000/
            uri: video_dv_540p_1800000_atmos.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dolbyvision-dolbyatmos-damf-aac-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v2160:
                      properties:
