# Bitmovin Encoding Template — generated by bitovp from plan "kantar-audio-watermark"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: kantar-audio-watermark
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_HIGH_QUALITY
      v540:
        properties:
          name: Sample video codec configuration
          height: 540
          bitrate: 600000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
      a64:
        properties:
          bitrate: 64000
          rate: 44100
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: kantar-audio-watermark
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    kantarWatermark:
      kantar:
        properties:
          login: "{{KANTAR_LOGIN}}"
          password: "{{KANTAR_PASSWORD}}"
          licenseId: 4711
          channelName: Demo Channel JP
          contentReference: bbb-2026-08-06-ep01
          serverUrl: https://kantar.example.com/watermark
          reportOutputs:
            - outputId: $/outputs/s3/origin
              outputPath: output/kantar-audio-watermark/reports
              acl:
                - permission: PRIVATE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      v540:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v540
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
      a64:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a64
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/kantar-audio-watermark/video/360p
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/kantar-audio-watermark/video/540p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/kantar-audio-watermark/audio/128000
                acl:
                  - permission: PUBLIC_READ
        a64:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a64
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/kantar-audio-watermark/audio/64000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/kantar-audio-watermark/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
          a64:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/64000
              uri: audio_64000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a64
              muxingId: $/encodings/main/muxings/fmp4/a64
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_300000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
