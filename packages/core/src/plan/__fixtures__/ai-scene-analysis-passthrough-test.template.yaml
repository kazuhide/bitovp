# Bitmovin Encoding Template — generated by bitovp from plan "h264-mp4-ai-scene-analysis-passthrough-aws-test"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: h264-mp4-ai-scene-analysis-passthrough-aws-test
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v180:
        properties:
          name: Sample video codec configuration
          height: 180
          bitrate: 200000
          presetConfiguration: VOD_HIGH_QUALITY
          profile: HIGH
          minKeyframeInterval: 2
          maxKeyframeInterval: 2
          refFrames: 4
          bframes: 3
          cabac: true
          adaptiveSpatialTransform: true
          weightedPredictionPFrames: SMART
          colorConfig:
            copyColorPrimariesFlag: true
            copyColorTransferFlag: true
            copyColorSpaceFlag: true
encodings:
  main:
    properties:
      name: h264-mp4-ai-scene-analysis-passthrough-aws-test
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: BETA
    streams:
      v180:
        properties:
          name: Stream H264 AI Scene Analysis
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v180
          mode: STANDARD
    muxings:
      mp4:
        v180:
          properties:
            filename: 180p.mp4
            streams:
              - streamId: $/encodings/main/streams/v180
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-mp4-ai-scene-analysis-passthrough-aws-test/video
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        aiSceneAnalysis:
          features:
            assetDescription:
              filename: h264-mp4-ai-scene-analysis-passthrough-aws-test.json
              outputs:
                - outputId: $/outputs/s3/origin
                  outputPath: output/h264-mp4-ai-scene-analysis-passthrough-aws-test/ai
                  acl:
                    - permission: PUBLIC_READ
            outputLanguageCodes:
              outputLanguageCodes:
                - ja
                - ko
