title = "Public source secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Synthetic value used by this regression test."
condition = "AND"
regexTarget = "line"
paths = ['''^apps/web/src/app/api/auth/login/guessrate\.test\.ts$''']
regexes = ['''^\s*const SECRET = "0123456789abcdef0123456789abcdef0123456789abcdef";\s*$''']

