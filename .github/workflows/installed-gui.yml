name: Installed GUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bitovp/db build
      - run: node --test scripts/installed-gui-smoke.test.mjs scripts/nonpaid-submit-proof.test.mjs scripts/database-restore-proof.test.mjs
      - run: pnpm --filter @bitovp/web exec tsc --project ../../tests/browser/tsconfig.json
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node scripts/installed-gui-smoke.mjs --state-file "$RUNNER_TEMP/bitovp-gui-state.json"
      - name: Remove only this job's owned test resources
        if: always()
        run: node scripts/installed-gui-smoke.mjs --cleanup --state-file "$RUNNER_TEMP/bitovp-gui-state.json"
