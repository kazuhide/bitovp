name: Encoding resource proofs

on:
  pull_request:
    paths:
      - .github/workflows/encoding-resource-proofs.yml
      - apps/web/src/lib/server/encoding-resources/**
      - apps/web/src/lib/encoding-metadata.ts
      - apps/web/src/lib/encoding-statistics.ts
      - apps/web/src/app/api/encoding-native/**
      - verification/lean/encoding-resources/**
  push:
    branches: [main]
    paths:
      - .github/workflows/encoding-resource-proofs.yml
      - apps/web/src/lib/server/encoding-resources/**
      - apps/web/src/lib/encoding-metadata.ts
      - apps/web/src/lib/encoding-statistics.ts
      - apps/web/src/app/api/encoding-native/**
      - verification/lean/encoding-resources/**

permissions:
  contents: read

jobs:
  resource-window-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: verification/lean/encoding-resources
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - run: node --test verification/lean/encoding-resources/*.test.mjs
