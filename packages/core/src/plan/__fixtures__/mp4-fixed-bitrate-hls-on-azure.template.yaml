# Bitmovin Encoding Template — generated by bitovp from plan "h264-aac-mp4-fixed-bitrate-hls-azure"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: h264-aac-mp4-fixed-bitrate-hls-azure
inputs:
  azure:
    main:
      properties:
        name: Test Azure Input
        accountName: "{{INPUT_MAIN_ACCOUNT_NAME}}"
        accountKey: "{{INPUT_MAIN_ACCOUNT_KEY}}"
        container: sample-input-container
outputs:
  azure:
    origin:
      properties:
        name: Test Azure Output
        accountName: "{{OUTPUT_ORIGIN_ACCOUNT_NAME}}"
        accountKey: "{{OUTPUT_ORIGIN_ACCOUNT_KEY}}"
        container: sample-output-container
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_HIGH_QUALITY
      v540:
        properties:
          name: Sample video codec configuration
          height: 540
          bitrate: 600000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
      a64:
        properties:
          bitrate: 64000
          rate: 44100
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: h264-aac-mp4-fixed-bitrate-hls-azure
      cloudRegion: AZURE_JAPAN_EAST
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      v540:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v540
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
      a64:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a64
          mode: STANDARD
    muxings:
      mp4:
        v360:
          properties:
            filename: video_360p.mp4
            fragmentedMP4MuxingManifestType: HLS_BYTE_RANGES
            fragmentDuration: 4000
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-mp4-fixed-bitrate-hls-azure/video/360p
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            filename: video_540p.mp4
            fragmentedMP4MuxingManifestType: HLS_BYTE_RANGES
            fragmentDuration: 4000
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-mp4-fixed-bitrate-hls-azure/video/540p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            filename: aac_128000.mp4
            fragmentedMP4MuxingManifestType: HLS_BYTE_RANGES
            fragmentDuration: 4000
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-mp4-fixed-bitrate-hls-azure/audio/128000
                acl:
                  - permission: PUBLIC_READ
        a64:
          properties:
            filename: aac_64000.mp4
            fragmentedMP4MuxingManifestType: HLS_BYTE_RANGES
            fragmentDuration: 4000
            streams:
              - streamId: $/encodings/main/streams/a64
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-mp4-fixed-bitrate-hls-azure/audio/64000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/azure/origin
            outputPath: output/h264-aac-mp4-fixed-bitrate-hls-azure/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/mp4/a128
          a64:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/64000
              uri: audio_64000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a64
              muxingId: $/encodings/main/muxings/mp4/a64
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_300000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/mp4/v360
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/mp4/v540
