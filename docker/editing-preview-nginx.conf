worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;

    # Resolve again after a web container rebuild, without restarting the gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream editing_web {
        zone editing_web 64k;
        server web:3100 resolve;
        keepalive 8;
    }

    server {
        listen 8080;
        client_max_body_size 1m;

        # Shared proxy settings also apply to the bounded PNG upload route.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;

        location ~ "^/api/library/edits/[0-9a-fA-F-]{36}/images$" {
            client_max_body_size 12m;
            proxy_pass http://editing_web;
        }
        location / {
            # The target is fixed; client URL/Host headers cannot select another server.
            proxy_pass http://editing_web;
        }
    }
}
