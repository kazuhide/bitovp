# Bitmovin Encoding Template — generated by bitovp from plan "labels-infrastructure-preview"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: labels-infrastructure-preview
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v540:
        properties:
          name: Sample video codec configuration
          height: 540
          bitrate: 600000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: labels-infrastructure-preview
      cloudRegion: EXTERNAL
      encoderVersion: STABLE
      labels:
        - p5
        - cloud-connect
      infrastructure:
        infrastructureId: 00000000-0000-4000-8000-0000000000c1
        cloudRegion: AWS_AP_NORTHEAST_1
    streams:
      v540:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v540
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v540:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/labels-infrastructure-preview/video/540p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/labels-infrastructure-preview/audio/128000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        tweaks:
          audioVideoSyncMode: RESYNC_AT_START
        handleVariableInputFps: true
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        previewHlsManifests:
          - manifestId: $/manifests/hls/hls
        previewDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/labels-infrastructure-preview/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
      streams:
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/labels-infrastructure-preview/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v540:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/540p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v540
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
