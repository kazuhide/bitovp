              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/dd192
              muxingId: $/encodings/main/muxings/fmp4/dd192-mux
          aac192-mux:
            properties:
              name: AAC
              groupId: audio
              language: en
              segmentPath: audio/aac/192000
              uri: aac_audio_192000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/aac192
              muxingId: $/encodings/main/muxings/fmp4/aac192-mux
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360
            uri: video_1000000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dv-with-atmos-ddp-dd-aac/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
            audio:
              atmos:
                properties:
                  lang: en
                  labels:
                    - value: atmos
                representations:
                  fmp4:
                    atmos448-mux:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/atmos/448000
