# Bitmovin Encoding Template — generated by bitovp from plan "h264-aac-fmp4-dash-template-and-timeline-aws"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: h264-aac-fmp4-dash-template-and-timeline-aws
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v360:
        properties:
          name: H264 360p
          height: 360
          bitrate: 600000
          presetConfiguration: VOD_STANDARD
          profile: MAIN
      v720:
        properties:
          name: H264 720p
          height: 720
          bitrate: 1500000
          presetConfiguration: VOD_STANDARD
          profile: HIGH
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: h264-aac-fmp4-dash-template-and-timeline-aws
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          name: Video 360p
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      v720:
        properties:
          name: Video 720p
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v720
          mode: STANDARD
      a128:
        properties:
          name: AAC 128kbps
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 4
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-dash-template-and-timeline-aws/video/360p_600000
                acl:
                  - permission: PUBLIC_READ
        v720:
          properties:
            segmentLength: 4
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v720
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-dash-template-and-timeline-aws/video/720p_1500000
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 4
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-dash-template-and-timeline-aws/audio/128000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties: {}
manifests:
  dash:
    template:
      properties:
        manifestName: template.mpd
        name: DASH (SegmentTemplate)
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/h264-aac-fmp4-dash-template-and-timeline-aws/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p_600000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
                    v720:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/720p_1500000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v720
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
    timeline:
      properties:
        manifestName: timeline.mpd
        name: DASH (SegmentTimeline)
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/h264-aac-fmp4-dash-template-and-timeline-aws/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p_600000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
                    v720:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/720p_1500000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v720
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
