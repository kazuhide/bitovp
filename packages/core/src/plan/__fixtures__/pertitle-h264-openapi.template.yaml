        perTitle:
          h264Configuration:
            minBitrate: 128000
            maxBitrate: 4000000
            targetQualityCrf: 17
            maxBitrateStepSize: 4
            complexityFactor: 1
            fixedResolutionAndBitrateConfiguration:
              forcedRenditionAboveHighestFixedRepresentation: 1
              forcedRenditionAboveHighestFixedRepresentationFactor: 1.2
              forcedRenditionAboveHighestFixedRepresentationCalculationMode: LAST_CALCULATED_BITRATE
            codecMinBitrateFactor: 0.8
            codecMaxBitrateFactor: 1.2
            codecBufsizeFactor: 2
        encodingMode: THREE_PASS
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/H264/2026-06-12__00-00-00/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128-ts:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/hls/
              uri: audio.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/ts/a128-ts
      streams: {}
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/H264/2026-06-12__00-00-00/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/dash/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
