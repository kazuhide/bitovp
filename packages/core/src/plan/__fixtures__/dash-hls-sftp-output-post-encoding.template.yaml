# Bitmovin Encoding Template — generated by bitovp from plan "h264-aac-fmp4-dash-hls-sftp-output-post-encoding"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: h264-aac-fmp4-dash-hls-sftp-output-post-encoding
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  sftp:
    origin:
      properties:
        name: Test SFTP Output
        host: "{{OUTPUT_ORIGIN_SFTP_HOST}}"
        port: "{{OUTPUT_ORIGIN_SFTP_PORT}}"
        username: "{{OUTPUT_ORIGIN_SFTP_USERNAME}}"
        password: "{{OUTPUT_ORIGIN_SFTP_PASSWORD}}"
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a64:
        properties:
          bitrate: 64000
          rate: 44100
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: h264-aac-fmp4-dash-hls-sftp-output-post-encoding
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264_short.mov
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      a64:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264_short.mov
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a64
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/sftp/origin
                outputPath: /content/encoding_test/h264-aac-fmp4-dash-hls-sftp-output-post-encoding/video/360p
        a64:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a64
            outputs:
              - outputId: $/outputs/sftp/origin
                outputPath: /content/encoding_test/h264-aac-fmp4-dash-hls-sftp-output-post-encoding/audio/64000
    start:
      properties: {}
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/sftp/origin
            outputPath: /content/encoding_test/h264-aac-fmp4-dash-hls-sftp-output-post-encoding/
      media:
        audio:
          a64:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/64000
              uri: audio_64000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a64
              muxingId: $/encodings/main/muxings/fmp4/a64
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_300000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/sftp/origin
            outputPath: /content/encoding_test/h264-aac-fmp4-dash-hls-sftp-output-post-encoding/
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
            audio:
              audio_set:
                properties:
                  lang: ja
                representations:
                  fmp4:
                    a64:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/64000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a64
