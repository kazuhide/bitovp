encodings:
  main:
    properties:
      name: Sample H264 Encoding
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v180:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: /path/to/your/input/file.mp4
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v180
          mode: PER_TITLE_TEMPLATE
      v360-300:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: /path/to/your/input/file.mp4
