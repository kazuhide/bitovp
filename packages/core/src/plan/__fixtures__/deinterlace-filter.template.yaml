# Bitmovin Encoding Template — generated by bitovp from plan "deinterlace-sample"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: deinterlace-sample
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v1080:
        properties:
          name: Sample video codec configuration
          height: 1080
          bitrate: 2000000
          presetConfiguration: VOD_STANDARD
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
filters:
  deinterlace:
    v1080-deint:
      properties:
        parity: AUTO
        mode: FRAME
        frameSelectionMode: ALL
        autoEnable: META_DATA_AND_CONTENT_BASED
encodings:
  main:
    properties:
      name: deinterlace-sample
      cloudRegion: AUTO
      encoderVersion: STABLE
    streams:
      v1080:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: <INSERT YOUR INPUT PATH>
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v1080
          mode: STANDARD
        filters:
          properties:
            - id: $/filters/deinterlace/v1080-deint
              position: 0
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: <INSERT YOUR INPUT PATH>
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v1080:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v1080
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/deinterlace-sample/video/1080p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/deinterlace-sample/audio/128000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "6"
        hlsMediaPlaylistVersion: "6"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/deinterlace-sample/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
      streams:
        v1080:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/1080p
            uri: video_2000000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v1080
            muxingId: $/encodings/main/muxings/fmp4/v1080
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/deinterlace-sample/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v1080:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/1080p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v1080
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
