              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v180:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v180
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/H264/2026-06-12__00-00-00/video/dash/{height}p_{bitrate}/
