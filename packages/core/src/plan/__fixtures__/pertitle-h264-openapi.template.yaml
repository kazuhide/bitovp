          codecConfigId: $/configurations/video/h264/v360-300
          mode: PER_TITLE_TEMPLATE_FIXED_RESOLUTION_AND_BITRATE
          perTitleSettings:
            fixedResolutionAndBitrateSettings:
              minBitrate: 300000
              maxBitrate: 500000
              bitrateSelectionMode: COMPLEXITY_RANGE
              lowComplexityBoundaryForMaxBitrate: 2160000
