# Bitmovin Encoding Template — generated by bitovp from plan "h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure
inputs:
  azure:
    main:
      properties:
        name: Test Azure Input
        accountName: "{{INPUT_MAIN_ACCOUNT_NAME}}"
        accountKey: "{{INPUT_MAIN_ACCOUNT_KEY}}"
        container: sample-input-container
outputs:
  azure:
    origin:
      properties:
        name: Test Azure Output
        accountName: "{{OUTPUT_ORIGIN_ACCOUNT_NAME}}"
        accountKey: "{{OUTPUT_ORIGIN_ACCOUNT_KEY}}"
        container: sample-output-container
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_HIGH_QUALITY
      v540:
        properties:
          name: Sample video codec configuration
          height: 540
          bitrate: 600000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
      a64:
        properties:
          bitrate: 64000
          rate: 44100
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure
      cloudRegion: AZURE_JAPAN_EAST
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      v540:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v540
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
          conditions:
            type: CONDITION
            attribute: AUDIOSTREAMCOUNT
            operator: ">"
            value: "0"
      a64:
        properties:
          inputStreams:
            - inputId: $/inputs/azure/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a64
          mode: STANDARD
          conditions:
            type: CONDITION
            attribute: AUDIOSTREAMCOUNT
            operator: ">"
            value: "0"
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/video/360p
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/video/540p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/audio/128000
                acl:
                  - permission: PUBLIC_READ
        a64:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a64
            outputs:
              - outputId: $/outputs/azure/origin
                outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/audio/64000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/azure/origin
            outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
          a64:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/64000
              uri: audio_64000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a64
              muxingId: $/encodings/main/muxings/fmp4/a64
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_300000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/azure/origin
            outputPath: output/h264-aac-fmp4-fixed-bitrate-dash-hls-with-stream-condition-azure/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
                    v540:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/540p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v540
            audio:
              audio_set:
                properties:
                  lang: ja
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
                    a64:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/64000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a64
