                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/dolby-digital/192000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/dd192-mux
              aac:
                properties:
                  lang: en
                  labels:
                    - value: aac
                representations:
                  fmp4:
                    aac192-mux:
                      properties:
                        type: TEMPLATE
