# Bitmovin Encoding Template — generated by bitovp from plan "dolbyvision-dolbyatmos-adm-hls-dash-fmp4"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: dolbyvision-dolbyatmos-adm-hls-dash-fmp4
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h265:
      v1080:
        properties:
          name: H265 DV 1080p
          height: 1080
          bitrate: 2000000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 0.5
      v540:
        properties:
          name: H265 DV 540p
          height: 540
          bitrate: 1000000
          dynamicRangeFormat: DOLBY_VISION
          adaptiveQuantizationStrength: 1.2
  audio:
    dolbyAtmos:
      atmos448:
        properties:
          bitrate: 448000
          rate: 48000
          loudnessControl:
            meteringMode: ITU-R BS.1770-4
            dialogueIntelligence: ENABLED
            speechThreshold: 15
encodings:
  main:
    properties:
      name: dolbyvision-dolbyatmos-adm-hls-dash-fmp4
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    inputStreams:
      dolbyAtmos:
        atmos-in:
          properties:
            inputId: $/inputs/s3/main
            inputPath: <INSERT_DOLBY_ATMOS_ADM_PATH>
            inputFormat: ADM
      dolbyVision:
        dv-in:
          properties:
            inputId: $/inputs/s3/main
            videoInputPath: <INSERT_DOLBY_VISION_VIDEO_PATH>
            metadataInputPath: <INSERT_DOLBY_VISION_METADATA_PATH>
    streams:
      v1080:
        properties:
          name: Stream H265 DV 1080p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v1080
          mode: STANDARD
      v540:
        properties:
          name: Stream H265 DV 540p
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v540
          mode: STANDARD
      atmos448:
        properties:
          name: Stream ATMOS 448000bps
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyAtmos/atmos-in
          codecConfigId: $/configurations/audio/dolbyAtmos/atmos448
          mode: STANDARD
    muxings:
      fmp4:
        v1080:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v1080
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-adm-hls-dash-fmp4/video/1080/
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-adm-hls-dash-fmp4/video/540/
                acl:
                  - permission: PUBLIC_READ
        atmos448:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/atmos448
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dolbyvision-dolbyatmos-adm-hls-dash-fmp4/audio/448000/
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "8"
        hlsMediaPlaylistVersion: "8"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dolbyvision-dolbyatmos-adm-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          atmos448:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/448000/
              uri: audio_448000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/atmos448
              muxingId: $/encodings/main/muxings/fmp4/atmos448
      streams:
        v1080:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/1080/
            uri: video_2000000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v1080
            muxingId: $/encodings/main/muxings/fmp4/v1080
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540/
            uri: video_1000000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dolbyvision-dolbyatmos-adm-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v1080:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/1080/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v1080
                    v540:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/540/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v540
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    atmos448:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/448000/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/atmos448
