name: Dependency security

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - name: Resolve the committed dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check all dependency advisories
        run: node scripts/dependency-audit.mjs --output "$RUNNER_TEMP/dependency-audit"
      - name: Retain raw dependency audit and mitigation proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            ${{ runner.temp }}/dependency-audit/audit.stdout.json
            ${{ runner.temp }}/dependency-audit/audit.stderr.txt
            ${{ runner.temp }}/dependency-audit/audit-exit.json
            ${{ runner.temp }}/dependency-audit/verified.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify registry package signatures
        run: pnpm audit signatures
