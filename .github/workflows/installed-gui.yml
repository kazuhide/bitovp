name: Installed GUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-gui:
    # Keep browser dependencies on an explicit OS during runner-image migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      BITOVP_BOMBADIL_BINARY: ${{ runner.temp }}/bombadil
      BITOVP_BOMBADIL_OUTPUT: ${{ runner.temp }}/bitovp-installed-bombadil
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Ubuntu mirrors for browser dependencies
        timeout-minutes: 5
        run: |
          python3 -B scripts/prepare-browser-ci-apt.test.py
          python3 -B scripts/prepare-browser-ci-apt.py
      - name: Prepare the distributed source archive without Git metadata
        run: |
          archive_dir=$(mktemp -d "$RUNNER_TEMP/bitovp-source.XXXXXX")
          git archive HEAD | tar -x -C "$archive_dir"
          test ! -e "$archive_dir/.git"
          printf 'BITOVP_ARCHIVE_DIR=%s\n' "$archive_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - run: pnpm test:release-gates
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - run: pnpm --filter @bitovp/db build
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - run: node --test scripts/installed-gui-smoke.test.mjs scripts/nonpaid-submit-proof.test.mjs scripts/database-restore-proof.test.mjs
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - run: pnpm --filter @bitovp/web exec tsc --project ../../tests/browser/tsconfig.json
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - name: Verify the official Bombadil binary for installed application exploration
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/antithesishq/bombadil/releases/download/v0.7.10/bombadil-x86_64-linux \
            --output "$BITOVP_BOMBADIL_BINARY"
          printf '%s  %s\n' 6f2664ca7d4067017b4efb26db5c29d6dcfecdc78131f96989d336f12420cc1b "$BITOVP_BOMBADIL_BINARY" | sha256sum --check --strict
          chmod 700 "$BITOVP_BOMBADIL_BINARY"
      - name: Reuse an earlier build of the same FFmpeg sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'docker/vmaf-models.sha256', 'scripts/native-media-tools.sh') }}
      - name: Get the worker image's FFmpeg and the VMAF models that it pins
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
        run: sh scripts/native-media-tools.sh --cache "$RUNNER_TEMP/ffmpeg-build" "$RUNNER_TEMP/native-media"
      - name: Reuse the HDR build for these exact native sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-hdr-build
          key: ffmpeg-hdr-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'docker/ffmpeg-hdr-wrap.patch', 'docker/ffmpeg-hdr-colorimetry.patch', 'docker/hdr-ffmpeg-patches.sha256', 'docker/hdr-vmaf-models.sha256', 'docker/hdr-build-proof.sh', 'docker/hdr-build-proof.py', 'scripts/native-hdr-tools.mjs') }}
      - name: Verify HDR binaries and rerun the current HDR proof
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
        run: node scripts/native-hdr-tools.mjs --cache "$RUNNER_TEMP/ffmpeg-hdr-build" "$RUNNER_TEMP/native-hdr"
      - run: node scripts/installed-gui-smoke.mjs --ffmpeg "$RUNNER_TEMP/native-media" --ffmpeg-hdr "$RUNNER_TEMP/native-hdr" --state-file "$RUNNER_TEMP/bitovp-gui-state.json"
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
      - name: Save synthetic HDR UI screenshots
        if: always() && env.BITOVP_ARCHIVE_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hdr-ui-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bitovp-gui-state.json.hdr-screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Save bounded installed Bombadil evidence without browser profiles or screenshots
        if: always() && env.BITOVP_ARCHIVE_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-bombadil-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bitovp-installed-bombadil/summary.json
            ${{ runner.temp }}/bitovp-installed-bombadil/*/summary.json
            ${{ runner.temp }}/bitovp-installed-bombadil/*/specification.ts
            ${{ runner.temp }}/bitovp-installed-bombadil/*/installed-wizard-model.ts
            ${{ runner.temp }}/bitovp-installed-bombadil/*/trace/trace.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: Remove only this job's owned test resources
        if: always() && env.BITOVP_ARCHIVE_DIR != ''
        working-directory: ${{ env.BITOVP_ARCHIVE_DIR }}
        run: node scripts/installed-gui-smoke.mjs --cleanup --state-file "$RUNNER_TEMP/bitovp-gui-state.json"
