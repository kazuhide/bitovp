name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres-runner
      - run: pnpm --filter @bitovp/db build
      - name: Run mandatory PostgreSQL integration tests
        run: pnpm test:postgres --state-file "$RUNNER_TEMP/bitovp-postgres-state.json"
      - name: Remove owned PostgreSQL fixture after success, failure or cancellation
        if: always()
        run: node scripts/postgres-integration.mjs --cleanup --state-file "$RUNNER_TEMP/bitovp-postgres-state.json"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          rm "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: node --test scripts/secret-scan.test.mjs
      - run: node scripts/secret-scan.mjs

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - name: Test caption alignment without loading models
        run: python3 -B apps/worker/scripts/test-caption-forced-align.py
      - name: Test local semantic gateway without models
        run: python3 -B -m unittest discover -s tools/local-semantic-gateway -p 'test_*.py' -v
      - name: Test clip evaluation tools with synthetic inputs
        run: python3 -B -m unittest discover -s tools/clip-quality -p 'test_*.py' -v
      - run: pnpm test:api-coverage
      - run: pnpm test:release-gates
      - run: pnpm test:editing-preview
      # Also here: this job always runs, and the suite checks that the jobs
      # which run the gated tests are still in this file.
      - run: pnpm test:gated-runner
      - run: pnpm test:feature-verification
      - run: pnpm --filter @bitovp/db build
      - name: Run every registered QC contract feature
        run: |
          pnpm verify:feature run qc-resource-allocation --output "$RUNNER_TEMP/feature-qc-resource-allocation"
          pnpm verify:feature run qc-measurement-validity --output "$RUNNER_TEMP/feature-qc-measurement-validity"
          pnpm verify:feature run qc-runtime-safety --output "$RUNNER_TEMP/feature-qc-runtime-safety"
      - run: pnpm --filter @bitovp/worker smoke
      - run: node --test scripts/web-test-shards.test.mjs
      - run: node --test scripts/bombadil-*.test.mjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [core, db, storage, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bitovp/db build
      - run: pnpm --filter @bitovp/${{ matrix.package }} test --maxWorkers=2 --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"
      - name: Require every skipped test to run in another job
        run: pnpm test:skip-audit "@bitovp/${{ matrix.package }}" "$RUNNER_TEMP/vitest-report.json"

  web-test-shards:
    name: tests (web shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bitovp/db build
      - run: touch .env.migrate
      - name: Run one quarter of the complete Web test inventory
        env:
          WEB_SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/web-test-shards.mjs run "$WEB_SHARD_INDEX" "$RUNNER_TEMP/web-tests-$WEB_SHARD_INDEX"
      - name: Save only the sanitized Web test receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/web-tests-${{ matrix.shard }}/receipt.json
          retention-days: 1
          if-no-files-found: error

  web-tests-complete:
    name: tests (web)
    needs: [web-test-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_SHARDS_RESULT: ${{ needs.web-test-shards.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Require every shard job to succeed
        run: node scripts/web-test-shards.mjs require-success
      - name: Download this run and attempt's Web receipts separately
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-tests-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/web-test-receipts
          merge-multiple: false
      - name: Require the complete Web inventory and audit all skipped tests
        run: node scripts/web-test-shards.mjs aggregate "$RUNNER_TEMP/web-test-receipts"

  native-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:gated-runner
      - run: pnpm --filter @bitovp/db build
      - name: Reuse an earlier build of the same FFmpeg sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'docker/vmaf-models.sha256', 'scripts/native-media-tools.sh') }}
      - name: Get the worker image's FFmpeg and the VMAF models that it pins
        run: |
          sh scripts/native-media-tools.sh --cache "$RUNNER_TEMP/ffmpeg-build" "$RUNNER_TEMP/native-media"
          printf '%s\n' "$RUNNER_TEMP/native-media/bin" >> "$GITHUB_PATH"
          printf 'VMAF_MODEL_DIR=%s\n' "$RUNNER_TEMP/native-media/model" >> "$GITHUB_ENV"
      - name: Run every test that drives real FFmpeg
        run: pnpm test:native-media

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:gated-runner
      - run: pnpm --filter @bitovp/db build
      - name: Take the Redis server out of the image that production pins
        run: |
          sh scripts/redis-server-tools.sh "$RUNNER_TEMP/redis"
          printf '%s\n' "$RUNNER_TEMP/redis/bin" >> "$GITHUB_PATH"
      - name: Run every test that needs Redis
        run: pnpm test:redis

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - name: Install the pinned package manager
        run: |
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/corepack-bitovp.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: node scripts/dependency-audit.mjs --output "$RUNNER_TEMP/dependency-audit"
      - name: Retain raw dependency audit and mitigation proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit/
          if-no-files-found: error
          retention-days: 7
      - run: pnpm audit signatures
