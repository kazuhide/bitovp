# Bitmovin Encoding Template — generated by bitovp from plan "av1-aac-fmp4-dash-hls-aws"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: av1-aac-fmp4-dash-hls-aws
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    av1:
      v360:
        properties:
          height: 360
          bitrate: 600000
          presetConfiguration: VOD_STANDARD
      v720:
        properties:
          height: 720
          bitrate: 1500000
          presetConfiguration: VOD_QUALITY
          autoLevelSetup: ENABLED
          colorConfig:
            copyColorPrimariesFlag: true
            copyColorTransferFlag: true
            copyColorSpaceFlag: true
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: av1-aac-fmp4-dash-hls-aws
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/av1/v360
          mode: STANDARD
      v720:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/av1/v720
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
          conditions:
            type: CONDITION
            attribute: AUDIOSTREAMCOUNT
            operator: ">"
            value: "0"
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/av1-aac-fmp4-dash-hls-aws/video/360p
                acl:
                  - permission: PUBLIC_READ
        v720:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v720
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/av1-aac-fmp4-dash-hls-aws/video/720p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/av1-aac-fmp4-dash-hls-aws/audio/128000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/av1-aac-fmp4-dash-hls-aws/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
        v720:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/720p
            uri: video_1500000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v720
            muxingId: $/encodings/main/muxings/fmp4/v720
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/av1-aac-fmp4-dash-hls-aws/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
                    v720:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/720p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v720
            audio:
              audio_set:
                properties:
                  lang: ja
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
