# Bitmovin Encoding Template — generated by bitovp from plan "per-title-av1-aac-fmp4-dash-aws"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: per-title manifest entries enumerate run-produced
# muxings — they expand at run time and are not listed here.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: per-title-av1-aac-fmp4-dash-aws
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    av1:
      v360:
        properties:
          encodingMode: THREE_PASS
          height: 360
          presetConfiguration: VOD_STANDARD
      v720:
        properties:
          encodingMode: THREE_PASS
          height: 720
          presetConfiguration: VOD_QUALITY
          autoLevelSetup: ENABLED
  audio:
    aac:
      a128:
        properties:
          name: AAC Codec Configuration
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: per-title-av1-aac-fmp4-dash-aws
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/av1/v360
          mode: PER_TITLE_TEMPLATE
      v720:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/av1/v720
          mode: PER_TITLE_TEMPLATE_FIXED_RESOLUTION_AND_BITRATE
          perTitleSettings:
            fixedResolutionAndBitrateSettings:
              minBitrate: 700000
              maxBitrate: 1700000
              bitrateSelectionMode: COMPLEXITY_RANGE
              lowComplexityBoundaryForMaxBitrate: 1500000
              highComplexityBoundaryForMaxBitrate: 3200000
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
          conditions:
            type: CONDITION
            attribute: AUDIOSTREAMCOUNT
            operator: ">"
            value: "0"
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/per-title-av1-aac-fmp4-dash-aws/video/{height}p_{bitrate}_{uuid}/
                acl:
                  - permission: PUBLIC_READ
        v720:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v720
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/per-title-av1-aac-fmp4-dash-aws/video/{height}p_{bitrate}_{uuid}/
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/per-title-av1-aac-fmp4-dash-aws/audio/
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        perTitle:
          av1Configuration:
            minBitrate: 128000
            maxBitrate: 3200000
            targetQualityCrf: 18
            maxBitrateStepSize: 4
            fixedResolutionAndBitrateConfiguration:
              forcedRenditionAboveHighestFixedRepresentation: 1
              forcedRenditionAboveHighestFixedRepresentationFactor: 1.2
              forcedRenditionAboveHighestFixedRepresentationCalculationMode: LAST_CALCULATED_BITRATE
manifests:
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/per-title-av1-aac-fmp4-dash-aws/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
