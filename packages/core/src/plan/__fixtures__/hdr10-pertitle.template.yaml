# Bitmovin Encoding Template — generated by bitovp from plan "Sample HDR10 Encoding"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: per-title manifest entries enumerate run-produced
# muxings — they expand at run time and are not listed here.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: Sample HDR10 Encoding
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h265:
      v-main10:
        properties:
          name: Sample video codec configuration
          profile: main10
          pixelFormat: YUV420P10LE
          minKeyframeInterval: 2
          maxKeyframeInterval: 2
          rcLookahead: 60
          subMe: 5
          maxCTUSize: "64"
          motionSearch: STAR
          tuIntraDepth: "4"
          tuInterDepth: "4"
          weightPredictionOnPSlice: true
          weightPredictionOnBSlice: true
          sceneCutThreshold: 40
          motionSearchRange: 92
          adaptiveQuantizationMode: AUTO_VARIANCE_DARK_SCENES
          adaptiveQuantizationStrength: 1.2
          psyRateDistortionOptimization: 0
          psyRateDistortionOptimizedQuantization: 0
          qpMin: 15
          sao: true
          hdr: true
          masterDisplay: G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1)
          maxContentLightLevel: 800
          maxPictureAverageLightLevel: 400
          colorConfig:
            colorSpace: BT2020_NCL
            colorPrimaries: BT2020
            colorTransfer: SMPTE2084
  audio:
    aac:
      a128:
        properties:
          name: AAC Codec Configuration
          bitrate: 128000
          rate: 48000
          channelLayout: 5.1_BACK
encodings:
  main:
    properties:
      name: Sample HDR10 Encoding
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v-main10:
        properties:
          name: Stream H265 Nonep
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: hdr10/Sony Bravia OLED 4K Demo.mp4
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h265/v-main10
          mode: PER_TITLE_TEMPLATE
      a128:
        properties:
          name: Audio Stream
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: hdr10/Sony Bravia OLED 4K Demo.mp4
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v-main10:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v-main10
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: encoding_test/hdr10_2026-06-12__00-00-00/video/{height}p_{bitrate}/
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: encoding_test/hdr10_2026-06-12__00-00-00/audio/
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        perTitle:
          h265Configuration:
            autoRepresentations: {}
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "8"
        hlsMediaPlaylistVersion: "8"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: encoding_test/hdr10_2026-06-12__00-00-00/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/
              uri: audio.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
      streams: {}
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: encoding_test/hdr10_2026-06-12__00-00-00/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
