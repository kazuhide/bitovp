# Bitmovin Encoding Template — generated by bitovp from plan "per-title-h264-aac-fmp4-ai-scene-analysis-aws"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: per-title manifest entries enumerate run-produced
# muxings — they expand at run time and are not listed here.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: per-title-h264-aac-fmp4-ai-scene-analysis-aws
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      pt-video:
        properties:
          name: Sample video codec configuration
          presetConfiguration: VOD_HIGH_QUALITY
          profile: HIGH
          minKeyframeInterval: 2
          maxKeyframeInterval: 2
          refFrames: 4
          bframes: 3
          cabac: true
          adaptiveSpatialTransform: true
          weightedPredictionPFrames: SMART
          colorConfig:
            copyColorPrimariesFlag: true
            copyColorTransferFlag: true
            copyColorSpaceFlag: true
  audio:
    aac:
      aac192:
        properties:
          bitrate: 192000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: per-title-h264-aac-fmp4-ai-scene-analysis-aws
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: BETA
    streams:
      pt-video:
        properties:
          name: Stream H264 PerTitle
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/pt-video
          mode: PER_TITLE_TEMPLATE
      aac192:
        properties:
          name: Stream AAC 192kbps
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: big_buck_bunny_1080p_h264.mov
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/aac192
          mode: STANDARD
    muxings:
      fmp4:
        pt-video:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/pt-video
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/per-title-h264-aac-fmp4-ai-scene-analysis-aws/video/{height}_{bitrate}_{uuid}
                acl:
                  - permission: PUBLIC_READ
        aac192:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/aac192
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/per-title-h264-aac-fmp4-ai-scene-analysis-aws/audio/192000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        perTitle:
          h264Configuration:
            targetQualityCrf: 17
            autoRepresentations: {}
            codecMinBitrateFactor: 0.5
            codecMaxBitrateFactor: 2
            codecBufsizeFactor: 4
        aiSceneAnalysis:
          features:
            assetDescription:
              filename: per-title-h264-aac-fmp4-ai-scene-analysis-aws.json
              outputs:
                - outputId: $/outputs/s3/origin
                  outputPath: output/per-title-h264-aac-fmp4-ai-scene-analysis-aws/ai
                  acl:
                    - permission: PUBLIC_READ
            automaticAdPlacement:
              allSceneBoundaries:
                isEnabled: true
                insertCueTags: true
            outputLanguageCodes:
              outputLanguageCodes:
                - ja
                - ko
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "6"
        hlsMediaPlaylistVersion: "6"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/per-title-h264-aac-fmp4-ai-scene-analysis-aws/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          aac192:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/192000
              uri: audio_192000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/aac192
              muxingId: $/encodings/main/muxings/fmp4/aac192
      streams: {}
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/per-title-h264-aac-fmp4-ai-scene-analysis-aws/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    aac192:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/192000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/aac192
