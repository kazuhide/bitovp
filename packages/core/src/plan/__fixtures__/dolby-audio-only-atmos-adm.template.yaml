# Bitmovin Encoding Template — generated by bitovp from plan "audio-only-dolbyatmos-adm-hls-dash-fmp4"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: audio-only-dolbyatmos-adm-hls-dash-fmp4
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  audio:
    dolbyAtmos:
      atmos448:
        properties:
          bitrate: 448000
          rate: 48000
          loudnessControl:
            meteringMode: ITU-R BS.1770-4
            dialogueIntelligence: ENABLED
            speechThreshold: 15
encodings:
  main:
    properties:
      name: audio-only-dolbyatmos-adm-hls-dash-fmp4
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    inputStreams:
      dolbyAtmos:
        atmos-in:
          properties:
            inputId: $/inputs/s3/main
            inputPath: netflix-opencontent/SolLevante/atmos-adm/sollevante_lp_v01_DAMF_Nearfield_48k_24b_24.wav
            inputFormat: ADM
    streams:
      atmos448:
        properties:
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyAtmos/atmos-in
          codecConfigId: $/configurations/audio/dolbyAtmos/atmos448
          mode: STANDARD
    muxings:
      fmp4:
        atmos448:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/atmos448
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/audio-only-dolbyatmos-adm-hls-dash-fmp4/audio/448000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties: {}
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "8"
        hlsMediaPlaylistVersion: "8"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/audio-only-dolbyatmos-adm-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          atmos448:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/448000
              uri: audio_448000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/atmos448
              muxingId: $/encodings/main/muxings/fmp4/atmos448
      streams:
        atmos448:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: audio/448000
            uri: audio_448000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/atmos448
            muxingId: $/encodings/main/muxings/fmp4/atmos448
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/audio-only-dolbyatmos-adm-hls-dash-fmp4/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    atmos448:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/448000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/atmos448
