# Bitmovin Encoding Template — generated by bitovp from plan "h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_STANDARD
          rate: 25
          minKeyframeInterval: 2
          maxKeyframeInterval: 2
      v540:
        properties:
          name: Sample video codec configuration
          height: 540
          bitrate: 600000
          presetConfiguration: VOD_STANDARD
          rate: 25
          minKeyframeInterval: 2
          maxKeyframeInterval: 2
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    keyframes:
      ad1:
        properties:
          time: 0.32
      ad2:
        properties:
          time: 19.2
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: "{YOUR INPUT FILE PATH}"
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      v540:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: "{YOUR INPUT FILE PATH}"
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v540
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: "{YOUR INPUT FILE PATH}"
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned/video/360p
                acl:
                  - permission: PUBLIC_READ
        v540:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v540
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned/video/540p
                acl:
                  - permission: PUBLIC_READ
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned/audio/128000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties: {}
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "6"
        hlsMediaPlaylistVersion: "6"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          a128:
            properties:
              name: HLS Audio Media
              groupId: audio
              language: en
              segmentPath: audio/128000
              uri: audio_128000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/a128
              muxingId: $/encodings/main/muxings/fmp4/a128
      streams:
        v360:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/360p
            uri: video_300000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v360
            muxingId: $/encodings/main/muxings/fmp4/v360
        v540:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/540p
            uri: video_600000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v540
            muxingId: $/encodings/main/muxings/fmp4/v540
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/h264-aac-fmp4-hls-dash-with-keyframes-segment-non-aligned/
            acl:
              - permission: PUBLIC_READ
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
                    v540:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/540p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v540
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TIMELINE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
