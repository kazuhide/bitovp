# Bitmovin Encoding Template — generated by bitovp from plan "Dolby Atmos Encoding - Progressive Mp4"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: Dolby Atmos Encoding - Progressive Mp4
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  audio:
    dolbyAtmos:
      atmos448:
        properties:
          name: Atmos Codec Configuration
          bitrate: 448000
          rate: 48000
          loudnessControl:
            meteringMode: ITU-R BS.1770-4
            dialogueIntelligence: ENABLED
            speechThreshold: 15
encodings:
  main:
    properties:
      name: Dolby Atmos Encoding - Progressive Mp4
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    inputStreams:
      dolbyAtmos:
        atmos-in:
          properties:
            inputId: $/inputs/s3/main
            inputPath: sollevante_lp_v01_DAMF_Nearfield_48k_24b_24.wav
            inputFormat: ADM
    streams:
      atmos448:
        properties:
          name: Audio Stream
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyAtmos/atmos-in
          codecConfigId: $/configurations/audio/dolbyAtmos/atmos448
          mode: STANDARD
    muxings:
      mp4:
        atmos448:
          properties:
            filename: output.mp4
            streams:
              - streamId: $/encodings/main/streams/atmos448
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/Dolby_Atmos_Encoding__Progressive_Mp4/2026-06-12__00-00-00/
                acl:
                  - permission: PUBLIC_READ
    start:
      properties: {}
