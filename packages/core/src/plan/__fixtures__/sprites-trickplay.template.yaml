# Bitmovin Encoding Template — generated by bitovp from plan "h264-sprites-trickplay-aws"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: h264-sprites-trickplay-aws
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h264:
      v720:
        properties:
          name: Sample video codec configuration
          height: 720
          bitrate: 3000000
          presetConfiguration: VOD_HIGH_QUALITY
encodings:
  main:
    properties:
      name: h264-sprites-trickplay-aws
      cloudRegion: AWS_AP_NORTHEAST_1
      encoderVersion: STABLE
    streams:
      v720:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v720
          mode: STANDARD
        sprites:
          sprite720:
            properties:
              height: 90
              distance: 10
              unit: SECONDS
              hTiles: 10
              vTiles: 10
              spriteName: sprite.jpg
              filename: sprite.jpg
              vttName: sprite.vtt
              creationMode: INTERVAL_START
              outputs:
                - outputId: $/outputs/s3/origin
                  outputPath: output/h264-sprites-trickplay-aws/sprite
                  acl:
                    - permission: PUBLIC_READ
    muxings:
      fmp4:
        v720:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v720
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/h264-sprites-trickplay-aws/video/720p
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "4"
        hlsMediaPlaylistVersion: "4"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/h264-sprites-trickplay-aws/
            acl:
              - permission: PUBLIC_READ
      media: {}
      streams:
        v720:
          properties:
            audio: audio
            closedCaptions: NONE
            segmentPath: video/720p
            uri: video_3000000.m3u8
            encodingId: $/encodings/main
            streamId: $/encodings/main/streams/v720
            muxingId: $/encodings/main/muxings/fmp4/v720
