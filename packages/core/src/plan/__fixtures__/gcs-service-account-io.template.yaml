# Bitmovin Encoding Template — generated by bitovp from plan "gcs-service-account-io"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
# NOTE: this plan uses POST_ENCODING manifest generation, which a
# template start cannot express — manifests are included for reference.
metadata:
  type: VOD
  name: gcs-service-account-io
inputs:
  gcsServiceAccount:
    main:
      properties:
        name: GCS Service Account Input
        bucketName: gcs-input-bucket
        cloudRegion: EUROPE_WEST_1
        serviceAccountCredentials: "{{INPUT_MAIN_SERVICE_ACCOUNT_JSON}}"
outputs:
  gcsServiceAccount:
    origin:
      properties:
        name: GCS Service Account Output
        bucketName: gcs-output-bucket
        cloudRegion: EUROPE_WEST_1
        serviceAccountCredentials: "{{OUTPUT_ORIGIN_SERVICE_ACCOUNT_JSON}}"
configurations:
  video:
    h264:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 300000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      a128:
        properties:
          bitrate: 128000
          rate: 48000
          channelLayout: STEREO
encodings:
  main:
    properties:
      name: gcs-service-account-io
      cloudRegion: GOOGLE_EUROPE_WEST_1
      encoderVersion: STABLE
    streams:
      v360:
        properties:
          inputStreams:
            - inputId: $/inputs/gcsServiceAccount/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: VIDEO_RELATIVE
              position: 0
          codecConfigId: $/configurations/video/h264/v360
          mode: STANDARD
      a128:
        properties:
          inputStreams:
            - inputId: $/inputs/gcsServiceAccount/main
              inputPath: sintel/Sintel.2010.1080p.mkv
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/a128
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/gcsServiceAccount/origin
                outputPath: output/gcs-service-account-io/video/360p
        a128:
          properties:
            segmentLength: 6
            segmentNaming: segment_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/a128
            outputs:
              - outputId: $/outputs/gcsServiceAccount/origin
                outputPath: output/gcs-service-account-io/audio/128000
    start:
      properties: {}
manifests:
  dash:
    dash:
      properties:
        manifestName: stream.mpd
        name: DASH Manifest
        outputs:
          - outputId: $/outputs/gcsServiceAccount/origin
            outputPath: output/gcs-service-account-io/
      periods:
        period:
          properties: {}
          adaptationsets:
            video:
              video_set:
                properties: {}
                representations:
                  fmp4:
                    v360:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: video/360p
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/v360
            audio:
              audio_set:
                properties:
                  lang: en
                representations:
                  fmp4:
                    a128:
                      properties:
                        type: TEMPLATE
                        mode: TEMPLATE_REPRESENTATION
                        segmentPath: audio/128000
                        encodingId: $/encodings/main
                        muxingId: $/encodings/main/muxings/fmp4/a128
