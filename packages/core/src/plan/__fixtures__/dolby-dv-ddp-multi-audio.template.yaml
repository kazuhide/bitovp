# Bitmovin Encoding Template — generated by bitovp from plan "dv-with-atmos-ddp-dd-aac"
# DRAFT SUBSET of the plan: validate before submitting —
# schema: https://raw.githubusercontent.com/bitmovin/bitmovin-api-sdk-examples/main/bitmovin-encoding-template.json
# Secrets are exported as {{PLACEHOLDER}} variables (vault never leaves this app).
# Numeric substitutions (e.g. the SFTP port) must be unquoted numbers.
metadata:
  type: VOD
  name: dv-with-atmos-ddp-dd-aac
inputs:
  s3:
    main:
      properties:
        name: Test S3 Input
        bucketName: sample-input-bucket
        accessKey: "{{INPUT_MAIN_ACCESS_KEY}}"
        secretKey: "{{INPUT_MAIN_SECRET_KEY}}"
outputs:
  s3:
    origin:
      properties:
        name: Test S3 Output
        bucketName: sample-output-bucket
        accessKey: "{{OUTPUT_ORIGIN_ACCESS_KEY}}"
        secretKey: "{{OUTPUT_ORIGIN_SECRET_KEY}}"
configurations:
  video:
    h265:
      v360:
        properties:
          name: Sample video codec configuration
          height: 360
          bitrate: 1000000
          dynamicRangeFormat: DOLBY_VISION
          maxBitrate: 2000000
          bufsize: 4000000
          presetConfiguration: VOD_HIGH_QUALITY
  audio:
    aac:
      aac192:
        properties:
          bitrate: 192000
          rate: 48000
          channelLayout: STEREO
    dolbyAtmos:
      atmos448:
        properties:
          bitrate: 448000
          rate: 48000
          loudnessControl:
            meteringMode: ITU-R BS.1770-4
            dialogueIntelligence: ENABLED
            speechThreshold: 15
    dolbyDigitalPlus:
      ddp192:
        properties:
          bitrate: 192000
          rate: 48000
          channelLayout: STEREO
          loudnessControl: {}
    dolbyDigital:
      dd192:
        properties:
          bitrate: 192000
          rate: 48000
          channelLayout: STEREO
          loudnessControl: {}
encodings:
  main:
    properties:
      name: dv-with-atmos-ddp-dd-aac
      cloudRegion: AWS_AP_SOUTHEAST_1
      encoderVersion: STABLE
    inputStreams:
      dolbyAtmos:
        atmos-in:
          properties:
            inputId: $/inputs/s3/main
            inputPath: netflix-opencontent/SolLevante/atmos-adm/sollevante_lp_v01_DAMF_Nearfield_48k_24b_24.wav
            inputFormat: ADM
      dolbyVision:
        dv-in:
          properties:
            inputId: $/inputs/s3/main
            videoInputPath: netflix-opencontent/SolLevante/dolbyvision/sollevante_j2k.mxf
            metadataInputPath: netflix-opencontent/SolLevante/dolbyvision/sollevante_j2k_sidecar.xml
    streams:
      v360:
        properties:
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyVision/dv-in
          codecConfigId: $/configurations/video/h265/v360
          mode: STANDARD
      atmos448:
        properties:
          inputStreams:
            - inputStreamId: $/encodings/main/inputStreams/dolbyAtmos/atmos-in
          codecConfigId: $/configurations/audio/dolbyAtmos/atmos448
          mode: STANDARD
      ddp192:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: netflix-opencontent/SolLevante/imf/AUDIO_4467fc2f-2536-44ba-b1f9-010e0ae3f6b1.mxf
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/dolbyDigitalPlus/ddp192
          mode: STANDARD
      dd192:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: netflix-opencontent/SolLevante/imf/AUDIO_4467fc2f-2536-44ba-b1f9-010e0ae3f6b1.mxf
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/dolbyDigital/dd192
          mode: STANDARD
      aac192:
        properties:
          inputStreams:
            - inputId: $/inputs/s3/main
              inputPath: netflix-opencontent/SolLevante/imf/AUDIO_4467fc2f-2536-44ba-b1f9-010e0ae3f6b1.mxf
              selectionMode: AUDIO_RELATIVE
              position: 0
          codecConfigId: $/configurations/audio/aac/aac192
          mode: STANDARD
    muxings:
      fmp4:
        v360:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/v360
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dv-with-atmos-ddp-dd-aac/video/360
                acl:
                  - permission: PUBLIC_READ
        atmos448-mux:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/atmos448
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dv-with-atmos-ddp-dd-aac/audio/atmos/448000
                acl:
                  - permission: PUBLIC_READ
        ddp192-mux:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/ddp192
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dv-with-atmos-ddp-dd-aac/audio/dolby-digital-plus/192000
                acl:
                  - permission: PUBLIC_READ
        dd192-mux:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/dd192
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dv-with-atmos-ddp-dd-aac/audio/dolby-digital/192000
                acl:
                  - permission: PUBLIC_READ
        aac192-mux:
          properties:
            segmentLength: 6
            segmentNaming: seg_%number%.m4s
            initSegmentName: init.mp4
            streams:
              - streamId: $/encodings/main/streams/aac192
            outputs:
              - outputId: $/outputs/s3/origin
                outputPath: output/dv-with-atmos-ddp-dd-aac/audio/aac/192000
                acl:
                  - permission: PUBLIC_READ
    start:
      properties:
        manifestGenerator: V2
        vodHlsManifests:
          - manifestId: $/manifests/hls/hls
        vodDashManifests:
          - manifestId: $/manifests/dash/dash
manifests:
  hls:
    hls:
      properties:
        manifestName: stream.m3u8
        name: HLS Manifest
        hlsMasterPlaylistVersion: "8"
        hlsMediaPlaylistVersion: "8"
        outputs:
          - outputId: $/outputs/s3/origin
            outputPath: output/dv-with-atmos-ddp-dd-aac/
            acl:
              - permission: PUBLIC_READ
      media:
        audio:
          atmos448-mux:
            properties:
              name: Atmos
              groupId: audio
              language: en
              segmentPath: audio/atmos/448000
              uri: atmos_audio_448000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/atmos448
              muxingId: $/encodings/main/muxings/fmp4/atmos448-mux
          ddp192-mux:
            properties:
              name: DDP
              groupId: audio
              language: en
              segmentPath: audio/dolby-digital-plus/192000
              uri: ddp_audio_192000.m3u8
              encodingId: $/encodings/main
              streamId: $/encodings/main/streams/ddp192
              muxingId: $/encodings/main/muxings/fmp4/ddp192-mux
          dd192-mux:
            properties:
              name: DD
              groupId: audio
              language: en
              segmentPath: audio/dolby-digital/192000
